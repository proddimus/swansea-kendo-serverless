<!doctype html>
<html lang="en">
  <head>
    <title>{{ page.title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% endif %}
    <link rel="canonical" href="https://www.swansea-kendo.club{{ page.url }}">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Swansea Kendo Club">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:url" content="https://www.swansea-kendo.club{{ page.url }}">
    {% if page.description %}
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}
    <meta property="og:image" content="https://www.swansea-kendo.club/assets/untitled1of13.jpg">
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
    <link rel="manifest" href="/assets/favicons/site.webmanifest">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" type="text/css" href="application.css" />
    <link rel="stylesheet" type="text/css" href="landing_page.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/49400f99ff.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body class="h-100" data-page="{{ page.url }}">
    <div class="h-100">
    {% include navbar.html %}
    <div class="page-container h-100">
      {{ content }}
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      (function () {
      document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
          if (!('ontouchstart' in window)) {
            new bootstrap.Tooltip(el);
          }
        });
        var nav = document.getElementById('mainNav');
        var isHome = document.body.dataset.page === '/';
        function updateNav() {
          if (isHome && window.scrollY < 60) {
            nav.classList.remove('bg-dark');
            nav.classList.add('nav-hero');
          } else {
            nav.classList.add('bg-dark');
            nav.classList.remove('nav-hero');
          }
        }
        updateNav();
        window.addEventListener('scroll', updateNav, { passive: true });
      })();
    </script>
  </body>
</html>
